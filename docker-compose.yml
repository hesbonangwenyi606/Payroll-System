version: '3.8'

services:
  db:
    image: postgres:15
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: payroll_system
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - '5432:5432'
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    working_dir: /app
    volumes:
      - .:/app:delegated
      - backend_node_modules:/app/node_modules
    ports:
      - '4000:4000'
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/payroll_system
      JWT_SECRET: local-docker-payroll-secret-change-before-deploy
      JWT_EXPIRES_IN: 8h
      REQUIRE_DATABASE: 'true'
      PORT: 4000
    depends_on:
      - db
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:4000 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    working_dir: /app
    volumes:
      - .:/app:delegated
      - frontend_node_modules:/app/node_modules
    ports:
      - '5173:5173'
    environment:
      VITE_API_URL: http://localhost:4000
      VITE_ALLOW_DEMO_AUTH: 'false'
    depends_on:
      - backend

volumes:
  db_data:
  backend_node_modules:
  frontend_node_modules:
